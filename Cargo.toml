[workspace]
resolver = "2"
members = [
    "crates/vb-core",
    "crates/vb-audio",
    "crates/vb-ui",
    "crates/vb-host",
    "crates/vb-stems",
    "crates/vb-io",
    "crates/vb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["VegieBreakDAW contributors"]
repository = "https://github.com/cdnjmusic/VegieBreakDAW"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
cpal = { version = "0.15" }
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "mp3", "ogg", "pcm"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
